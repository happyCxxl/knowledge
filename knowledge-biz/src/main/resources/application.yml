server:
  port: 4388

spring:
  application:
    name: @artifactId@
  main:
    allow-circular-references: true
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/knowledge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 10
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

knowledge:
  mybatis:
    show-sql: false
  operation-log:
    enabled: false

# B09 检索能力分层解锁：预留能力清单（RetrievalCapability 枚举名，逗号分隔；一期全关，
# 解锁 = 加枚举名，规则结构/前端/引擎零迁移）
retrieval:
  capabilities:
    enabled: ""

server:
  port: 4388

spring:
  application:
    name: @artifactId@
  main:
    allow-circular-references: true
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/knowledge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 10
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

knowledge:
  mybatis:
    show-sql: false
  operation-log:
    enabled: false
  auth:
    jwt:
      secret: knowledge-jwt-secret-change-me-in-production
      # 不勾选「记住我」：短期令牌 + sessionStorage；勾选：长期令牌 + localStorage
      ttl-days: 1
      ttl-days-remember: 30
    # 登录失败防护：达阈值后按「账号 + IP」或「IP」维度临时锁定（窗口自首次失败起算）
    guard:
      enabled: true
      fail-threshold: 5
      ip-fail-threshold: 20
      lock-minutes: 15
  file:
    max-size: 104857600
    enabled-formats: PDF,DOC,DOCX,XLS,XLSX
    temp-file-threshold: 10485760
  task:
    queue-key: knowledge:task:queue
    wakeup-timeout: 5s
    compensate-threshold: 5m
    low-freq-sweep-enabled: true
    low-freq-sweep-interval: 1m
    sweep-lock-ttl: 30s

# 文件服务：数据源首次初始化的缺省来源
# 数据源表为空时按本段参数 seed 两行（MinIO / 本地磁盘），storage-type 指的那种类型置为当前启用；
# 表里没有启用的数据源时按 storage-type 回落注册一条内置定义。连接参数的实际来源是 kb_storage_source.config_json。
file-center:
  storage-type: minio
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    file-bucket: files
    artifact-bucket: artifacts
  local:
    root-dir: ./data/file-center
    file-dir: files
    artifact-dir: artifacts

# 检索能力分层解锁：预留能力清单（RetrievalCapability 枚举名，逗号分隔；解锁 = 加枚举名）
retrieval:
  capabilities:
    enabled: ""



server:
  port: 4388

spring:
  application:
    name: @artifactId@
  main:
    allow-circular-references: true
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/knowledge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 10
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

knowledge:
  mybatis:
    show-sql: false
  operation-log:
    enabled: false
  auth:
    jwt:
      secret: knowledge-jwt-secret-change-me-in-production
      ttl-days: 7
  file:
    max-size: 104857600
    enabled-formats: PDF,DOC,DOCX,XLS,XLSX
    temp-file-threshold: 10485760
  task:
    queue-key: knowledge:task:queue
    wakeup-timeout: 5s
    compensate-threshold: 5m
    low-freq-sweep-enabled: false
    low-freq-sweep-interval: 10m
    sweep-lock-ttl: 30s

# 文件服务：MinIO 连接与桶
file-center:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  file-bucket: files
  artifact-bucket: artifacts

# 检索能力分层解锁：预留能力清单（RetrievalCapability 枚举名，逗号分隔；解锁 = 加枚举名）
retrieval:
  capabilities:
    enabled: ""
